<h2>Edit Student</h2>

<form method="POST">
    Name: <input type="text" name="name" value="{{ student[1] }}"><br>
    Math: <input type="number" name="math" value="{{ student[2] }}"><br>
    Science: <input type="number" name="science" value="{{ student[3] }}"><br>
    English: <input type="number" name="english" value="{{ student[4] }}"><br>
    Attendance: <input type="number" name="attendance" value="{{ student[5] }}"><br>

    <button type="submit">Update</button>
</form>
