<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center;
            margin-top: 100px;
        }
        form {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
        }
        input {
            margin: 10px;
            padding: 10px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background: #4facfe;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<h2>Login to Student Analytics System</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Enter Username" required><br>
    <input type="password" name="password" placeholder="Enter Password" required><br>
    <button type="submit">Admin Login</button>
</form>
</body>
</html>
